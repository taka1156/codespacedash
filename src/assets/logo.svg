<svg viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <!-- グラデーション定義 -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BA9FF"/>
      <stop offset="100%" stop-color="#7B3EFF"/>
    </linearGradient>
  </defs>

  <!-- アイコン（角丸スクエア） -->
  <rect
    x="0" y="8"
    width="64" height="64"
    rx="14" ry="14"
    fill="url(#iconGradient)"
  />

  <!-- アイコン内の "/>" 記号 -->
  <text
    x="32" y="43"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="75"
    fill="#FFFFFF"
  >⬡</text>

  <!-- テキスト "DevDash" -->
  <!-- "Dev" -->
  <text
    x="70" y="50"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="30"
    font-weight="600"
    fill="#FFFFFF"
  >Codespace</text>

  <!-- "Dash" -->
  <text
    x="225" y="50"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="30"
    font-weight="600"
    fill="#3BA9FF"
  >Dash</text>
</svg>
