<svg viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <title>QuotaDash</title>
  <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3BA9FF"/><stop offset="100%" stop-color="#7B3EFF"/></linearGradient></defs>
  <!-- アイコン：利用枠メーター -->
  <g transform="translate(0 8)">
    <rect width="64" height="64" rx="14" fill="url(#g)"/>
    <path d="M18.14,44.00 A16 16 0 1 1 45.86,44.00" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/><path d="M18.14,44.00 A16 16 0 0 1 42.95,24.34" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><line x1="32" y1="36" x2="38.16" y2="29.44" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><circle cx="32" cy="36" r="3.5" fill="#fff"/>
  </g>
  <!-- textLength でフォント差があっても枠内に収める -->
  <text x="78" y="53" textLength="214" lengthAdjust="spacingAndGlyphs"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="38" font-weight="700" fill="#FFFFFF">Quota<tspan fill="#3BA9FF">Dash</tspan></text>
</svg>
